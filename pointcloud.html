<head>

    <link rel="stylesheet" href="libs/potree/potree.css" type="text/css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Dark Mode Variables (Default) */
            --hr-red: #E91E24;
            --bg-color: #060809;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --panel-bg: rgba(255, 255, 255, 0.02);
            --border-color: rgba(255, 255, 255, 0.08);
            --section-bg: #0b0e10;
            --card-hover-bg: rgba(233, 30, 36, 0.05);
            --heading-color: #ffffff;
            --icon-color: #ffffff;
        }

        .light-mode {
            /* Light Mode Variables */
            --bg-color: #f9fafb;
            --text-main: #111827;
            --text-muted: #4b5563;
            --panel-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.08);
            --section-bg: #ffffff;
            --card-hover-bg: rgba(233, 30, 36, 0.05);
            --heading-color: #111827;
            --icon-color: #111827;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            scroll-behavior: smooth;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow: auto; /* Override Potree CSS */
            height: auto;   /* Override Potree CSS */
        }

        /* Typography Utility Classes */
        .text-theme-heading { color: var(--heading-color); transition: color 0.4s ease; }
        .text-theme-muted { color: var(--text-muted); transition: color 0.4s ease; }

        /* Generic Glass Panel */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .glass-nav {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Theme Toggle */
        #theme-toggle {
            position: fixed;
            right: 24px;
            top: 100px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--icon-color);
        }

        #theme-toggle:hover {
            transform: rotate(15deg) scale(1.05);
            border-color: var(--hr-red);
            color: var(--hr-red);
        }

        .toggle-icon { width: 20px; height: 20px; stroke-width: 1.5; transition: transform 0.5s ease; }
        .light-mode .icon-moon { display: block; }
        .light-mode .icon-sun { display: none; }
        .icon-moon { display: none; }
        .icon-sun { display: block; }

        /* Potree Specific Overrides */
        #potree_render_area {
            width: 100%;
            height: 70vh;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .potree_sidebar_container {
            display: none; /* Hide sidebar by default for cleaner look */
        }
        
        .potree_container {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body class="antialiased">

    <button id="theme-toggle" onclick="toggleTheme()" title="Preklopi način">
        <svg class="toggle-icon icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg class="toggle-icon icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
    </button>

    <nav class="fixed w-full z-50 glass-nav top-0">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            
            <div class="flex items-center gap-8">
                <a href="index.html" class="flex items-center space-x-2 group">
                    <div class="w-8 h-8 bg-[#E91E24] rounded-sm flex items-center justify-center font-bold text-white group-hover:bg-white group-hover:text-[#E91E24] transition">K</div>
                    <span class="text-xl font-extrabold tracking-tight text-theme-heading">KIBLA2LAB</span>
                </a>
                
                <a href="3dscan.html" class="hidden md:flex items-center text-xs font-bold uppercase tracking-widest text-theme-muted hover:text-[#E91E24] transition gap-2 group">
                    <span class="transform group-hover:-translate-x-1 transition">←</span> Nazaj na LAB
                </a>
            </div>

            <div class="hidden md:flex space-x-10 text-sm font-semibold tracking-wide uppercase">
                <a href="about.html" class="text-theme-muted hover:text-[#E91E24] transition">O nas</a>
                <a href="index.html#services" class="text-theme-muted hover:text-[#E91E24] transition">Storitve</a>
                <a href="index.html#tech" class="text-theme-muted hover:text-[#E91E24] transition">Tehnologija</a>
                <a href="3dscan.html#contact" class="text-theme-muted hover:text-[#E91E24] transition">Kontakt</a>
            </div>
        </div>
    </nav>

    <header class="relative w-full h-[50vh] flex items-center justify-center pt-20">
        <div class="absolute inset-0 w-full h-full bg-[var(--section-bg)]">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[var(--bg-color)]"></div>
        </div>
        
        <div class="relative z-10 text-center max-w-5xl px-6">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6 tracking-tighter text-theme-heading">
                OBLAK <span class="text-[#E91E24]">TOČK</span>
            </h1>
            <p class="text-xl md:text-2xl font-light max-w-2xl mx-auto leading-relaxed text-theme-muted">
                Interaktivni pregled laserskega 3D zajema.
            </p>
        </div>
    </header>

    <section class="py-20">
        <div class="max-w-7xl mx-auto px-6">
            <div class="glass-panel p-4 rounded-xl">
                <div id="potree_render_area"></div>
            </div>
            
            <div class="mt-8 text-center">
                <p class="text-theme-muted text-sm italic">
                    Uporabite miško za navigacijo: Levi klik za vrtenje, desni klik za premikanje, kolesce za približevanje.
                </p>
            </div>
        </div>
    </section>

    <footer class="py-20 border-t border-[var(--border-color)] text-center">
        <div class="flex items-center justify-center space-x-2 mb-8">
            <div class="w-10 h-10 bg-[#E91E24] rounded-sm flex items-center justify-center font-bold text-xl text-white">K</div>
            <span class="text-3xl font-extrabold tracking-tight uppercase text-theme-heading">KIBLA2LAB</span>
        </div>
        <p class="text-theme-muted text-xs tracking-widest uppercase">© 2024 Vse pravice pridržane.</p>
    </footer>

    <script>
        // Check for file protocol (CORS issue)
        if (window.location.protocol === 'file:') {
            const warning = document.createElement('div');
            warning.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(233,30,36,0.9); color: white; padding: 20px; border-radius: 8px; z-index: 9999; max-width: 400px; text-align: center; font-weight: bold; box-shadow: 0 4px 20px rgba(0,0,0,0.5);';
            warning.innerHTML = 'OPOZORILO: Brskalnik blokira nalaganje 3D modela iz diska.<br><br>Prosimo, odprite to stran preko lokalnega strežnika (npr. VS Code Live Server).';
            document.body.appendChild(warning);
        }

        // Theme Logic
        function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
            }
        }
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }
        loadTheme();

        // Potree Initialization
        window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
        
        // Set script path for workers/resources
        Potree.scriptPath = "libs/potree/";
        
        viewer.setEDLEnabled(false);
        viewer.setFOV(60);
        viewer.setPointBudget(2_000_000);
        viewer.setBackground("skybox");
        viewer.loadSettingsFromURL();
        
        // Load the point cloud
        Potree.loadPointCloud("src/metadata.json", "Point Cloud").then(e => {
            let scene = viewer.scene;
            let pointcloud = e.pointcloud;
            
            let material = pointcloud.material;
            material.size = 1;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.SQUARE;
            material.activeAttributeName = "rgba";
            
            scene.addPointCloud(pointcloud);
            
            // Set custom view
            viewer.scene.view.position.set(-25.998867216217544, 33.464769913570464, 8.26328267742891);
            viewer.scene.view.lookAt(new THREE.Vector3(7.561288567099094, 52.48564417691219, -0.6603150575684626));

            viewer.setControls(viewer.orbitControls);
        }).catch(e => {
            console.error("Napaka pri nalaganju oblaka točk:", e);
            alert("Napaka pri nalaganju. Preverite konzolo za podrobnosti. Prepričajte se, da so datoteke metadata.json, octree.bin in hierarchy.bin prisotne v mapi src/.");
        });
    </script>

</body>
</html>
